name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag matching pubspec.yaml version (e.g. v0.7.1)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve version and release tag
        id: meta
        shell: pwsh
        run: |
          $pubspec = Get-Content -Raw pubspec.yaml
          if ($pubspec -notmatch '(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)(?:\+[0-9]+)?\s*$') {
            throw "Could not parse version from pubspec.yaml"
          }
          $appVersion = $Matches[1]
          $expectedTag = "v$appVersion"

          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.tag }}" -ne "") {
            $releaseTag = "${{ inputs.tag }}"
            if ($releaseTag -ne $expectedTag) {
              throw "Dispatch tag $releaseTag does not match pubspec.yaml version $expectedTag"
            }
            $shouldRelease = "true"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $releaseTag = "${{ github.ref_name }}"
            if ($releaseTag -ne $expectedTag) {
              throw "Pushed tag $releaseTag does not match pubspec.yaml version $expectedTag"
            }
            $shouldRelease = "true"
          } else {
            $releaseTag = $expectedTag
            $existing = git ls-remote --tags origin "refs/tags/$releaseTag"
            if ([string]::IsNullOrWhiteSpace($existing)) {
              Write-Host "Tag $releaseTag does not exist yet on origin. Proceeding with automated release."
              $shouldRelease = "true"
            } else {
              Write-Host "Tag $releaseTag already exists on origin. Skipping release."
              $shouldRelease = "false"
            }
          }

          "app_version=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "should_release=$shouldRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup Flutter
        if: steps.meta.outputs.should_release == 'true'
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2
        with:
          channel: stable
          cache: true

      - name: Verify & build Windows Release
        if: steps.meta.outputs.should_release == 'true'
        shell: pwsh
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build windows --release

      - name: Package Portable ZIP, Signed NSIS Installer, latest.json & SHA256 Checksums
        if: steps.meta.outputs.should_release == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $version = "${{ steps.meta.outputs.app_version }}"
          $tag = "${{ steps.meta.outputs.release_tag }}"
          $releaseDir = "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # 1. Portable ZIP archive
          $zipName = "GlassUsage_${version}_windows_x64_portable.zip"
          $zipPath = Join-Path "dist" $zipName
          Compress-Archive -Path "$releaseDir/*" -DestinationPath $zipPath -Force

          # 2. NSIS Setup Installer (.exe)
          $setupName = "GlassUsage_${version}_x64-setup.exe"
          $setupPath = Join-Path (Resolve-Path "dist").Path $setupName
          $buildAbs = (Resolve-Path $releaseDir).Path
          $makensis = "makensis.exe"
          if (-not (Get-Command $makensis -ErrorAction SilentlyContinue)) {
            $defaultNsis = "C:\Program Files (x86)\NSIS\makensis.exe"
            if (Test-Path $defaultNsis) {
              $makensis = $defaultNsis
            } else {
              choco install nsis -y --no-progress
              $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
            }
          }
          & $makensis "/DAPP_VERSION=$version" "/DBUILD_DIR=$buildAbs" "/DOUT_FILE=$setupPath" "windows/installer/glassusage.nsi"
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS installer build failed with exit code $LASTEXITCODE"
          }

          # 3. Sign NSIS Installer with Minisign & generate latest.json for in-app updater
          $sigBase64 = ""
          if (-not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            npx --yes @tauri-apps/cli@2 signer sign "$setupPath"
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$setupPath.sig")) {
              throw "Failed to sign installer with TAURI_SIGNING_PRIVATE_KEY"
            }
            $sigRaw = (Get-Content -Raw "$setupPath.sig").Trim()
            if ($sigRaw.StartsWith("untrusted comment:")) {
              $sigBase64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($sigRaw))
            } else {
              $sigBase64 = $sigRaw
            }
          }

          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$setupName"
          $latestObj = [ordered]@{
            version   = $version
            notes     = "GlassUsage $tag (Pure Flutter Windows) — Liquid Glass UI anti-jank rewrite, background Isolate SQLite engine, and full 10-agent support."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sigBase64
                url       = $downloadUrl
              }
              "windows-x86_64-nsis" = [ordered]@{
                signature = $sigBase64
                url       = $downloadUrl
              }
            }
          }
          $latestPath = Join-Path "dist" "latest.json"
          $latestObj | ConvertTo-Json -Depth 6 | Set-Content -Path $latestPath -Encoding utf8

          # 4. SHA256SUMS.txt
          $sumsPath = Join-Path "dist" "SHA256SUMS.txt"
          $lines = @()
          Get-ChildItem -Path "dist" -Filter "GlassUsage_*" | Where-Object { $_.Extension -ne ".sig" } | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash  $($_.Name)"
          }
          $lines | Set-Content -Path $sumsPath -Encoding utf8
          Get-Content $sumsPath

      - name: Ensure Git tag exists on remote
        if: steps.meta.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.release_tag }}"
          $version = "${{ steps.meta.outputs.app_version }}"
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ([string]::IsNullOrWhiteSpace($existing)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "Release GlassUsage $version"
            git push origin "refs/tags/$tag"
          }

      - name: Publish GitHub Release
        if: steps.meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: GlassUsage ${{ steps.meta.outputs.release_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## GlassUsage ${{ steps.meta.outputs.release_tag }} (Pure Flutter Windows)

            ### Install / Upgrade
            - **In-App Update**: Click **Settings → Updates → Check for updates** in existing `0.6.x` or `0.7.x` installations to upgrade in-place automatically.
            - **Installer (`GlassUsage_${{ steps.meta.outputs.app_version }}_x64-setup.exe`)**: Standard Windows NSIS installer with Start Menu & Desktop shortcuts. Existing user data in `%APPDATA%\com.glassusage.app` and legacy `%APPDATA%\com.glassusage.desktop` is preserved and automatically migrated on first launch.
            - **Portable (`GlassUsage_${{ steps.meta.outputs.app_version }}_windows_x64_portable.zip`)**: Extract and run `glassusage.exe` directly (no WebView2 runtime required).
            - **Checksums (`SHA256SUMS.txt`)**: SHA-256 hashes for release verification.
          files: |
            dist/GlassUsage_${{ steps.meta.outputs.app_version }}_x64-setup.exe
            dist/GlassUsage_${{ steps.meta.outputs.app_version }}_x64-setup.exe.sig
            dist/GlassUsage_${{ steps.meta.outputs.app_version }}_windows_x64_portable.zip
            dist/latest.json
            dist/SHA256SUMS.txt
