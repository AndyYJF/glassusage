name: glassusage
description: "Real-time token usage monitor for local AI coding agents, with an Apple Liquid Glass UI."
publish_to: 'none'
version: 0.6.3+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  sqlite3: ^2.7.5
  path: ^1.9.1
  http: ^1.3.0
  crypto: ^3.0.6
  watcher: ^1.1.1
  intl: any
  ffi: ^2.1.4
  win32: ^5.10.1
  dartssh2: ^2.11.0
  archive: ^4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pricing-fallback.json
    - assets/lens/
    - assets/icons/
