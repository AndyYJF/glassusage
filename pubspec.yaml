name: glassusage
description: "Real-time token usage monitor for local AI coding agents, with an Apple Liquid Glass UI."
publish_to: 'none'
version: 0.7.11+1

environment:
  sdk: ^3.13.5
  flutter: '>=3.47.7'

dependencies:
  desktop_glass:
    path: packages/desktop_glass
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  sqlite3: ^2.7.5
  path: ^1.9.1
  http: ^1.3.0
  crypto: ^3.0.6
  pinenacl: ^0.6.0
  pointycastle: ^4.0.0
  watcher: ^1.1.1
  intl: any
  ffi: ^2.1.4
  win32: ^5.10.1
  dartssh2: ^2.11.0
  archive: ^4.0.4
  window_manager: 0.5.2
  flutter_acrylic: ^1.1.4
  screen_retriever: 0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  shaders:
    - assets/shaders/liquid_glass.frag
  assets:
    - reference/liquid_glass/LICENSE
    - reference/liquid_glass/NOTICE
    - assets/pricing-fallback.json
    - assets/lens/
    - assets/icons/
