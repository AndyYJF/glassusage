# Cargo has no proxy setting of its own, so it falls back to git's `http.proxy`. When that
# points at a SOCKS5 endpoint, cargo's libcurl still speaks HTTP CONNECT to it and every
# request dies with "schannel: failed to receive handshake". An empty value disables the
# proxy for cargo only, leaving git's configuration untouched.
[http]
proxy = ""
check-revoke = false
multiplexing = false

[net]
retry = 3
