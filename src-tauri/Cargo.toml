[package]
name = "glassusage"
version = "0.3.0"
description = "Real-time token usage monitor for local AI coding agents"
authors = ["GlassUsage"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "glassusage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"
walkdir = "2"
glob = "0.3"
rayon = "1"
parking_lot = "0.12"
chrono = "0.4"
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
base64 = "0.22"
dirs = "5"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Password SSH without PuTTY / interactive TTY (key/agent still uses system OpenSSH).
russh = { version = "0.54", default-features = false, features = ["ring"] }
russh-sftp = "2.1"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.6"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }

[features]
# Tauri's own custom-protocol feature, enabled by `tauri build`.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
